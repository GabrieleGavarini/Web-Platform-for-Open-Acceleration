<svg xmlns="http://www.w3.org/2000/svg" width="1760" height="640" viewBox="0 0 1760 640" font-family="Carlito, Calibri, 'Liberation Sans', Arial, sans-serif">
<defs>
<marker id="g" viewBox="0 0 10 10" refX="8.5" refY="5" markerWidth="6.5" markerHeight="6.5" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#2F7044"/></marker>
<marker id="l" viewBox="0 0 10 10" refX="8.5" refY="5" markerWidth="6.5" markerHeight="6.5" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#3A8652"/></marker>
</defs>

<!-- A: question -->
<rect x="20" y="30" width="230" height="580" rx="8" fill="white" stroke="#c6c6c6" stroke-width="1.5"/>
<text x="135" y="70" font-size="21.6" font-weight="bold" fill="#2F7044" text-anchor="middle">Question</text>
<circle cx="135" cy="118" r="13" fill="#2C477E"/>
<path d="M111,162 a24,24 0 0 1 48,0 z" fill="#2C477E"/>
<path d="M48,200 H123 L135,182 L147,200 H222 Q230,200 230,208 V322 Q230,330 222,330 H48 Q40,330 40,322 V208 Q40,200 48,200 z" fill="white" stroke="#161616" stroke-width="1.3"/>
<text x="135" y="232" font-size="17" font-style="italic" fill="#161616" text-anchor="middle">Is a diagnosis-</text>
<text x="135" y="254" font-size="17" font-style="italic" fill="#161616" text-anchor="middle">support algorithm</text>
<text x="135" y="276" font-size="17" font-style="italic" fill="#161616" text-anchor="middle">a high-risk</text>
<text x="135" y="298" font-size="17" font-style="italic" fill="#161616" text-anchor="middle">AI system?</text>
<rect x="95" y="352" width="80" height="30" rx="15" fill="#2C477E"/>
<text x="135" y="373" font-size="17" font-weight="bold" fill="white" text-anchor="middle">AI Act</text>
<text x="135" y="424" font-size="18" fill="#2F7044" text-anchor="middle">one agent =</text>
<text x="135" y="446" font-size="18" fill="#2F7044" text-anchor="middle">one legislation</text>
<text x="135" y="468" font-size="18" fill="#2F7044" text-anchor="middle">+ its own graph</text>
<path d="M253,320 L286,320" fill="none" stroke="#2F7044" stroke-width="2.6" stroke-linecap="round" marker-end="url(#g)"/>

<!-- B: planner -->
<rect x="290" y="30" width="330" height="580" rx="8" fill="white" stroke="#c6c6c6" stroke-width="1.5"/>
<circle cx="320" cy="64" r="13" fill="#2F7044"/>
<text x="320" y="69" font-size="18.9" font-weight="bold" fill="white" text-anchor="middle">1</text>
<text x="342" y="70" font-size="24.3" font-weight="bold" fill="#2F7044">Research planner</text>
<text x="342" y="98" font-size="17.55" font-style="italic" fill="#525252">before any search</text>
<text x="310" y="145" font-size="18.5" fill="#161616">Splits the question into the</text>
<text x="310" y="168" font-size="18.5" fill="#161616">legal issues to research:</text>
<rect x="310" y="190" width="166" height="30" rx="15" fill="white" stroke="#8d8d8d" stroke-width="1.3"/>
<text x="393" y="211" font-size="16.5" fill="#161616" text-anchor="middle">classification rule</text>
<rect x="310" y="230" width="206" height="30" rx="15" fill="white" stroke="#8d8d8d" stroke-width="1.3"/>
<text x="413" y="251" font-size="16.5" fill="#161616" text-anchor="middle">third-party assessment</text>
<rect x="310" y="270" width="190" height="30" rx="15" fill="white" stroke="#8d8d8d" stroke-width="1.3"/>
<text x="405" y="291" font-size="16.5" fill="#161616" text-anchor="middle">resulting obligations</text>
<text x="310" y="332" font-size="17" font-weight="bold" fill="#2F7044">every issue is researched</text>
<rect x="310" y="380" width="290" height="152" rx="8" fill="white" stroke="#2C477E" stroke-width="2"/>
<rect x="326" y="368" width="80" height="24" rx="12" fill="#2C477E"/>
<text x="366" y="385" font-size="15.5" font-weight="bold" fill="white" text-anchor="middle">in code</text>
<text x="328" y="420" font-size="18.5" font-weight="bold" fill="#2C477E">Planning is enforced</text>
<text x="328" y="446" font-size="17" fill="#161616">When it was only requested</text>
<text x="328" y="468" font-size="17" fill="#161616">in the prompt, the model</text>
<text x="328" y="490" font-size="17" fill="#161616">tended to answer before</text>
<text x="328" y="512" font-size="17" fill="#161616">researching.</text>
<path d="M623,320 L656,320" fill="none" stroke="#2F7044" stroke-width="2.6" stroke-linecap="round" marker-end="url(#g)"/>

<!-- C: research loop -->
<rect x="660" y="30" width="520" height="580" rx="8" fill="white" stroke="#c6c6c6" stroke-width="1.5"/>
<circle cx="690" cy="64" r="13" fill="#2F7044"/>
<text x="690" y="69" font-size="18.9" font-weight="bold" fill="white" text-anchor="middle">2</text>
<text x="712" y="70" font-size="24.3" font-weight="bold" fill="#2F7044">Research loop</text>
<text x="712" y="98" font-size="17.55" font-style="italic" fill="#525252">reason, call a tool, read the result, repeat</text>
<rect x="680" y="118" width="482" height="84" rx="8" fill="#D3EDDA" stroke="#3A8652" stroke-width="2"/>
<text x="700" y="152" font-size="21" font-weight="bold" fill="#2F7044">Reason</text>
<text x="700" y="180" font-size="16.5" font-style="italic" fill="#2F7044">which issue is still open?</text>
<path d="M902,160 A15,15 0 1 1 919,175" fill="none" stroke="#2F7044" stroke-width="2.4" stroke-linecap="round"/><polygon points="908,175 920,168 920,182" fill="#2F7044"/>
<text x="950" y="154" font-size="17" fill="#1F3460">loop until every issue</text>
<text x="950" y="176" font-size="17" fill="#1F3460">is covered, then answer</text>
<path d="M760,204 V246" fill="none" stroke="#2F7044" stroke-width="2.2" stroke-linecap="round" marker-end="url(#g)"/>
<path d="M860,248 V206" fill="none" stroke="#3A8652" stroke-width="2.2" stroke-linecap="round" stroke-dasharray="5 4" marker-end="url(#l)"/>
<text x="752" y="232" font-size="16.5" font-style="italic" fill="#2F7044" text-anchor="end">call</text>
<text x="868" y="232" font-size="16.5" font-style="italic" fill="#2F7044">result</text>
<path d="M1050,204 V246" fill="none" stroke="#2F7044" stroke-width="2.2" stroke-linecap="round" marker-end="url(#g)"/>
<path d="M1120,248 V206" fill="none" stroke="#3A8652" stroke-width="2.2" stroke-linecap="round" stroke-dasharray="5 4" marker-end="url(#l)"/>
<text x="1042" y="232" font-size="16.5" font-style="italic" fill="#2F7044" text-anchor="end">call</text>
<text x="1128" y="232" font-size="16.5" font-style="italic" fill="#2F7044">result</text>

<rect x="680" y="250" width="312" height="350" rx="8" fill="white" stroke="#3A8652" stroke-width="2"/>
<rect x="680" y="250" width="312" height="5" rx="2" fill="#3A8652"/>
<text x="694" y="280" font-size="19" font-weight="bold" fill="#2F7044">search_corpus</text>
<text x="694" y="304" font-size="16.5" fill="#161616">one question → one graph search</text>
<rect x="692" y="316" width="288" height="240" rx="6" fill="#f4f4f4"/>
<text x="790" y="340" font-size="15" font-style="italic" fill="#2F7044" text-anchor="middle">selected topic</text>
<ellipse cx="790" cy="396" rx="88" ry="44" fill="#D3EDDA" stroke="#3A8652" stroke-width="2"/>
<ellipse cx="800" cy="510" rx="78" ry="30" fill="#e0e0e0"/>
<path d="M738,418 L768,404" stroke="#8d8d8d" stroke-width="1.3"/><circle cx="732" cy="421" r="6" fill="white" stroke="#161616" stroke-width="1.3"/>
<path d="M842,418 L812,404" stroke="#8d8d8d" stroke-width="1.3"/><circle cx="848" cy="421" r="6" fill="white" stroke="#161616" stroke-width="1.3"/>
<path d="M918,428 L814,400" fill="none" stroke="#525252" stroke-width="1.4" stroke-dasharray="4 3"/>
<path d="M793,418 L798,476" fill="none" stroke="#2F7044" stroke-width="2.4" stroke-linecap="round" marker-end="url(#g)"/>
<text x="808" y="456" font-size="16" font-style="italic" fill="#2F7044">cites</text>
<circle cx="790" cy="394" r="22" fill="#2F7044"/>
<text x="790" y="399" font-size="15" font-weight="bold" fill="white" text-anchor="middle">Art. 6</text>
<circle cx="800" cy="508" r="27" fill="white" stroke="#2F7044" stroke-width="2.4"/>
<text x="800" y="513" font-size="14" font-weight="bold" fill="#2F7044" text-anchor="middle">Annex I</text>
<path d="M920,410 h16 l10,10 v24 h-26 z" fill="white" stroke="#161616" stroke-width="1.4"/>
<path d="M936,410 v10 h10" fill="none" stroke="#161616" stroke-width="1.4"/>
<line x1="926" y1="428" x2="940" y2="428" stroke="#8d8d8d" stroke-width="1.8"/><line x1="926" y1="436" x2="940" y2="436" stroke="#8d8d8d" stroke-width="1.8"/>
<text x="933" y="464" font-size="15" fill="#525252" text-anchor="middle">guideline</text>
<rect x="692" y="566" width="90" height="26" rx="13" fill="white" stroke="#2F7044" stroke-width="1.3"/>
<text x="737" y="584" font-size="16" font-weight="bold" fill="#2F7044" text-anchor="middle">provisions</text>
<rect x="788" y="566" width="92" height="26" rx="13" fill="#f4f4f4" stroke="#8d8d8d" stroke-width="1.3"/>
<text x="834" y="584" font-size="16" fill="#161616" text-anchor="middle">documents</text>
<rect x="886" y="566" width="54" height="26" rx="13" fill="white" stroke="#2F7044" stroke-width="1.3" stroke-dasharray="4 3"/>
<text x="913" y="584" font-size="16" font-weight="bold" fill="#2F7044" text-anchor="middle">leads</text>

<rect x="1008" y="250" width="154" height="350" rx="8" fill="white" stroke="#3A8652" stroke-width="2"/>
<rect x="1008" y="250" width="154" height="5" rx="2" fill="#3A8652"/>
<text x="1085" y="280" font-size="17.5" font-weight="bold" fill="#2F7044" text-anchor="middle">lookup_provision</text>
<text x="1085" y="304" font-size="16.5" fill="#161616" text-anchor="middle">fetch one provision</text>
<path d="M948,428 C990,428 1010,440 1052,444" fill="none" stroke="#2F7044" stroke-width="2" stroke-dasharray="6 4" marker-end="url(#g)"/>
<text x="975" y="418" font-size="16" font-style="italic" fill="#2F7044" text-anchor="middle">lead</text>
<circle cx="1085" cy="446" r="29" fill="white" stroke="#2F7044" stroke-width="2.4" stroke-dasharray="5 4"/>
<text x="1085" y="451" font-size="15" font-weight="bold" fill="#2F7044" text-anchor="middle">Art. 43</text>
<text x="1085" y="500" font-size="15" font-style="italic" fill="#525252" text-anchor="middle">read the lead</text>
<path d="M1183,320 L1216,320" fill="none" stroke="#2F7044" stroke-width="2.6" stroke-linecap="round" marker-end="url(#g)"/>

<!-- D: grounded answer -->
<rect x="1220" y="30" width="520" height="580" rx="8" fill="white" stroke="#c6c6c6" stroke-width="1.5"/>
<circle cx="1250" cy="64" r="13" fill="#2F7044"/>
<text x="1250" y="69" font-size="18.9" font-weight="bold" fill="white" text-anchor="middle">3</text>
<text x="1272" y="70" font-size="24.3" font-weight="bold" fill="#2F7044">Grounded answer</text>
<text x="1272" y="98" font-size="17.55" font-style="italic" fill="#525252">rules every answer must follow</text>
<circle cx="1254" cy="144" r="12" fill="#2F7044"/><text x="1254" y="149.5" font-size="16" font-weight="bold" fill="white" text-anchor="middle">1</text>
<text x="1276" y="150" font-size="18.5" fill="#161616"><tspan font-weight="bold">Open</tspan> with a direct reply to the question</text>
<circle cx="1254" cy="190" r="12" fill="#2F7044"/><text x="1254" y="195.5" font-size="16" font-weight="bold" fill="white" text-anchor="middle">2</text>
<text x="1276" y="196" font-size="18.5" fill="#161616"><tspan font-weight="bold">Cite only</tspan> provisions that were retrieved</text>
<circle cx="1254" cy="236" r="12" fill="#2F7044"/><text x="1254" y="241.5" font-size="16" font-weight="bold" fill="white" text-anchor="middle">3</text>
<text x="1276" y="242" font-size="18.5" fill="#161616"><tspan font-weight="bold">Cite the amending text first</tspan>, then the base act</text>
<text x="1276" y="264" font-size="17" font-style="italic" fill="#525252">e.g. the Digital Omnibus before the AI Act</text>
<circle cx="1254" cy="302" r="12" fill="#2F7044"/><text x="1254" y="307.5" font-size="16" font-weight="bold" fill="white" text-anchor="middle">4</text>
<text x="1276" y="308" font-size="18.5" fill="#161616">Nothing relevant retrieved? <tspan font-weight="bold">Say so</tspan>:</text>
<text x="1276" y="330" font-size="18.5" fill="#161616">never answer from memory</text>
<rect x="1240" y="380" width="480" height="110" rx="8" fill="white" stroke="#2C477E" stroke-width="2"/>
<rect x="1256" y="368" width="80" height="24" rx="12" fill="#2C477E"/>
<text x="1296" y="385" font-size="15.5" font-weight="bold" fill="white" text-anchor="middle">in code</text>
<text x="1258" y="420" font-size="18.5" font-weight="bold" fill="#2C477E">Citations are checked</text>
<text x="1258" y="446" font-size="17" fill="#161616">Citations of guidelines, rulings and papers are</text>
<text x="1258" y="468" font-size="17" fill="#161616">removed: they are research aids, not sources.</text>
<rect x="1240" y="512" width="480" height="82" rx="8" fill="#EEF7F0" stroke="#3A8652" stroke-width="2"/>
<text x="1258" y="540" font-size="17" font-style="italic" fill="#161616">Answer, grounded in statutory provisions only</text>
<rect x="1256" y="552" width="122" height="30" rx="15" fill="white" stroke="#2F7044" stroke-width="1.3"/>
<text x="1317" y="572" font-size="16.5" font-weight="bold" fill="#2F7044" text-anchor="middle">Art. 6 AI Act</text>
<rect x="1386" y="552" width="138" height="30" rx="15" fill="white" stroke="#2F7044" stroke-width="1.3"/>
<text x="1455" y="572" font-size="16.5" font-weight="bold" fill="#2F7044" text-anchor="middle">Annex I AI Act</text>
<rect x="1532" y="552" width="130" height="30" rx="15" fill="white" stroke="#2F7044" stroke-width="1.3"/>
<text x="1597" y="572" font-size="16.5" font-weight="bold" fill="#2F7044" text-anchor="middle">Art. 43 AI Act</text>
<g transform="translate(1672,523)"><line x1="20" y1="2" x2="20" y2="10" stroke="#2C477E" stroke-width="3"/><circle cx="20" cy="2" r="3.5" fill="#2C477E"/><rect x="6" y="10" width="28" height="22" rx="6" fill="#2C477E"/><circle cx="14" cy="21" r="3.5" fill="white"/><circle cx="26" cy="21" r="3.5" fill="white"/><path d="M2,48 v-8 a8,8 0 0 1 8,-8 h20 a8,8 0 0 1 8,8 v8 z" fill="#2C477E"/></g>
</svg>
